[package]
name = "fuckthunder-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read-only GPUI IMAP account checker and mail viewer"

[lib]
name = "fuckthunder_gui"
path = "src/lib.rs"

[[bin]]
name = "fuckthunder-gui"
path = "src/main.rs"

[[bin]]
name = "fuckthunder-check"
path = "src/checker.rs"

[dependencies]
anyhow = "1"
base64.workspace = true
axum = "0.8"
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
fuckthunder-core.workspace = true
fuckthunder-imap.workspace = true
fuckthunder-imap-proto.workspace = true
futures = "0.3"
gpui = "0.2.2"
gpui-component = "=0.5.1"
html2text = "0.17"
mailparse = "0.16"
percent-encoding = "2"
rand.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
wry = "0.57.2"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
http-body-util = "0.1"
tower = "0.5"
